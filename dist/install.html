placeTitle\">Replace saved game?&lt;/h2>&lt;p id=\"replaceText\">&lt;/p>&lt;div class=\"lobby-actions\">&lt;button value=\"cancel\" autofocus>Keep existing game&lt;/button>&lt;button class=\"primary\" value=\"replace\">Replace with new game&lt;/button>&lt;/div>&lt;/form>&lt;/dialog>&lt;dialog id=\"battleplanDialog\" class=\"battleplan-dialog\" aria-labelledby=\"battleplanDialogTitle\">&lt;div class=\"battleplan-dialog-body\">&lt;h2 id=\"battleplanDialogTitle\">&lt;/h2>&lt;p id=\"battleplanDialogRule\" class=\"plan-rule\">&lt;/p>&lt;img id=\"battleplanDialogMap\" class=\"battleplan-map\" alt=\"Battleplan deployment map\">&lt;p class=\"battleplan-source\">Deployment map and rules reference: &lt;a href=\"https://www.wahapedia.ru/aos4/the-rules/general-s-handbook-2026-27/\" target=\"_blank\" rel=\"noopener\">General’s Handbook 2026–27 reference&lt;/a>&lt;/p>&lt;div class=\"lobby-actions\">&lt;button type=\"button\" id=\"closeBattleplanDialog\">Close&lt;/button>&lt;/div>&lt;/div>&lt;/dialog>&lt;dialog id=\"starterDialog\">&lt;h2>Who starts this turn?&lt;/h2>&lt;p>This army will be active during Top.&lt;/p>&lt;div id=\"starterButtons\" class=\"starter-buttons\">&lt;/div>&lt;button id=\"cancelStarter\">Cancel&lt;/button>&lt;/dialog>&lt;div id=\"workspace\" hidden>&lt;div class=\"tablebar\">&lt;h2 id=\"tableTitle\">&lt;/h2>&lt;button id=\"changeTable\">Change table / game&lt;/button>&lt;/div>&lt;section class=\"game\" aria-label=\"Shared game settings\">&lt;div>&lt;div class=\"battleplan-row\">&lt;span class=\"battleplan-name\" id=\"battleplanName\">&lt;/span>&lt;button type=\"button\" class=\"battleplan-info\" id=\"battleplanInfo\">View battleplan&lt;/button>&lt;/div>&lt;p class=\"game-note\">Selected when the game was created · shared by both players&lt;/p>&lt;p class=\"game-note\" id=\"activeLabel\">&lt;/p>&lt;/div>&lt;div>&lt;div class=\"turn-caption\">CURRENT TURN&lt;/div>&lt;div class=\"turn-display\" id=\"turnlabel\">-&lt;/div>&lt;div class=\"next-display\" id=\"nextLabel\">&lt;/div>&lt;div class=\"turn-actions\">&lt;button id=\"backTurn\">← Previous turn&lt;/button>&lt;button class=\"primary\" id=\"nextTurn\">Next turn →&lt;/button>&lt;/div>&lt;/div>&lt;/section>&lt;section class=\"players\" aria-label=\"Scores for two players\">&lt;/section>&lt;/div>&lt;iframe id=\"remote\" title=\"Scoreboard connected to Google Sheets\">&lt;/iframe>&lt;details>&lt;summary>Manage tournament lists in Google Sheets&lt;/summary>&lt;p>Add new options on a new row. Lists sync to the app about once a minute. Click “Refresh lists” to load the latest synced options.&lt;/p>&lt;ul>&lt;li>&lt;strong>AoS Tables:&lt;/strong> unique ID in column A, name in B, Active in C. Blank Active cells count as enabled.&lt;/li>&lt;li>&lt;strong>AoS Armies / AoS Battleplans:&lt;/strong> name in A, alliance or group in B, Active in C.&lt;/li>&lt;li>&lt;strong>AoS Battletactics:&lt;/strong> name in A, Active in B.&lt;/li>&lt;li>&lt;strong>Game · ID:&lt;/strong> live scoreboard output for both players side by side. Scores and player names are updated from Firebase after score changes. Make game changes in the app.&lt;/li>&lt;/ul>&lt;p>Uncheck Active to hide an option. Scores, turns and game settings are managed in the app.&lt;/p>&lt;/details>&lt;/main>&lt;script type=\"module\">\r\nimport { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';\r\nimport { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';\r\nimport { getDatabase, ref, get, onValue, runTransaction } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js';\r\nconst firebaseConfig={apiKey:'AIzaSyDr3J7GBYLPXbXbzhfWqvKWcDr_MMo67L4',authDomain:'threshold-live.firebaseapp.com',projectId:'threshold-live',databaseURL:'https://threshold-live-default-rtdb.europe-west1.firebasedatabase.app',storageBucket:'threshold-live.firebasestorage.app',messagingSenderId:'368826443507',appId:'1:368826443507:web:f4c424d02e0a7ccbe43986'};\r\nconst firebaseApp=initializeApp(firebaseConfig),auth=getAuth(firebaseApp),db=getDatabase(firebaseApp);\r\nlet config=null,records=null,subscribed=false,starting=false,connected=false;\r\nfunction normalize(record){const r=structuredClone(record);r.game.history=r.game.history||[];r.players.forEach(p=>{p.tacticPoints=p.tactics.reduce((n,t)=>n+t.goals.reduce((a,b)=>a+b,0),0);p.victory=p.baseVictory+p.tacticPoints;});return r;}\r\nfunction clean(record){const r=structuredClone(record);r.players.forEach(p=>{delete p.victory;delete p.tacticPoints;});return r;}\r\nfunction apply(record,c,stepGame,catalogs){\r\n  if(!record)throw new Error('Table data is not available yet.');\r\n  const r=normalize(record);\r\n  if((r.changeIds||[]).includes(c.id))return clean(r);\r\n  if((c.gameId||'')!==r.game.id)throw new Error('Another game has started on this table. Reload before continuing.');\r\n  const choice=(v,list)=>{if(typeof v!=='string'||(v&amp;&amp;!list.includes(v)))throw new Error('This option is no longer active. Refresh the lists.');};\r\n  const name=v=>{v=String(v||'').trim();if(!v||v.length>60||/^[=+\\-@]/.test(v))throw new Error('Enter a valid player name.');return v;};\r\n  if(c.scope==='newGame'){\r\n    choice(c.battleplan,catalogs.battleplans);if(!c.battleplan||c.players.length!==2)throw new Error('Configure both players and the battleplan.');\r\n    r.game={battleplan:c.battleplan,turn:0,phase:'-',active:0,starter:0,id:c.id,history:[]};\r\n    r.players=c.players.map(p=>{choice(p.faction,catalogs.armies);if(!p.faction||p.tactics.length!==2||!p.tactics[0]||!p.tactics[1]||p.tactics[0]===p.tactics[1])throw new Error('Choose an army and two different battletactics.');p.tactics.forEach(t=>choice(t,catalogs.tactics));return {name:name(p.name),faction:p.faction,command:4,army:0,rage:0,fury:0,baseVictory:0,tactics:p.tactics.map(name=>({name,goals:[0,0,0]}))};});\r\n  }else if(c.scope==='game'){\r\n    if(c.key==='advance'){if(r.game.turn===5&amp;&amp;r.game.phase==='END')throw new Error('The game has finished.');if((!r.game.turn||r.game.phase==='END')&amp;&amp;![1,2].includes(c.starter))throw new Error('Choose the starting player.');r.game=stepGame(r.game,c);}\r\n    else if(c.key==='back'){if(!r.game.turn)throw new Error('The game has not started.');r.game=stepGame(r.game,c);}\r\n    else if(c.key==='battleplan')throw new Error('Battleplan is locked after game creation.');\r\n    else if(c.key==='active'&amp;&amp;[0,1,2].includes(c.value))r.game.active=c.value;\r\n    else throw new Error('Unknown game field.');\r\n  }else if(c.scope==='player'){\r\n    if(![0,1].includes(c.player))throw new Error('Invalid player.');const p=r.players[c.player];\r\n    if(['command','army','rage','fury','victory'].includes(c.key)){\r\n      const key=c.key==='victory'?'baseVictory':c.key;\r\n      if(c.operation==='increment'){if(![1,-1].includes(c.delta))throw new Error('Invalid step.');p[key]=Math.max(0,p[key]+c.delta);}else p[key]=c.key==='victory'?c.value-p.tacticPoints:c.value;\r\n      if(!Number.isSafeInteger(p[key])||p[key]&lt;0||p[key]>1000000)throw new Error('Invalid score.');\r\n    }else if(c.key==='name')p.name=name(c.value);\r\n    else if(c.key==='faction'){choice(c.value,catalogs.armies);p.faction=c.value;}\r\n    else if(c.key==='tactic'){if(![0,1].includes(c.slot))throw new Error('Invalid tactic.');choice(c.value,catalogs.tactics);if(c.value&amp;&amp;p.tactics[1-c.slot].name===c.value)throw new Error('Choose two different battletactics.');if(p.tactics[c.slot].name!==c.value)p.tactics[c.slot]={name:c.value,goals:[0,0,0]};}\r\n    else if(c.key==='goal'){if(![0,1].includes(c.slot)||![0,1,2].includes(c.goal)||![0,5].includes(c.value)||!p.tactics[c.slot].name)throw new Error('Invalid objective.');p.tactics[c.slot].goals[c.goal]=c.value;}\r\n    else throw new Error('Unknown score field.');\r\n  }else throw new Error('Unknown change.');\r\n  r.revision=(r.revision||0)+1;r.changeIds=(r.changeIds||[]).concat(c.id).slice(-24);return clean(r);\r\n}\r\n\r\n\r\nconst battleplanMeta={\"Into the Fire\":{\"rule\":\"Twist: Both armies can use Secure the Gateway. While you are the underdog, use Determined Defenders. Score 3 VP for controlling at least 1 objective, 3 VP for controlling 2 or more, and 4 VP for controlling more than your opponent.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Into_the_Fire1.png\"},\"Bloodstained Coasts\":{\"rule\":\"Twist: From battle round 2, armies can use Emberstone-Augmented Weapons and Emberstone Cache. Score 3 VP for controlling at least 1 objective, 3 VP for controlling 2 or more, then 4 VP for the battleplan’s round-specific objective.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Bloodstained_Coasts.png\"},\"Avalanche of Ash\":{\"rule\":\"Twist: The underdog uses Collapsing Pass. Objectives can be removed as the battlefield shifts. Score points for controlling objectives and, later, terrain features in enemy territory.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Avalanche_of_Ash.png\"},\"Caverns of Slaughter\":{\"rule\":\"Twist: Both armies can Navigate the Tunnels; the underdog can use Shifting Passages. Score 3 VP for controlling at least 1 objective, 3 VP for controlling 2 or more, and 4 VP for controlling a pair of objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Caverns_of_Slaughter.png\"},\"What’s Yours is Ours\":{\"rule\":\"Twist: The coveted pair alternates between Golden Lions and Sun Seekers each battle round. The underdog can change the coveted pair with All the Rage. Score 3 VP for an objective, 3 VP for the coveted pair, and 4 VP for controlling more objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Whats_Yours_Is_Ours.png\"},\"Hidden Under Ash-Clouds\":{\"rule\":\"Twist: The underdog decides each round whether the ash-clouds are low-lying. While low-lying, movement and visibility through neutral territory are restricted. Score 3 VP for an objective, 3 VP for two or more, and 4 VP for controlling more objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Hidden_Under_Ash_Clouds.png\"},\"Warped Ruins\":{\"rule\":\"Terrain must be clustered within 12 inches. The underdog uses Spreading Warpfire to ignite terrain and cause mortal damage. Score 3 VP for an objective, 3 VP for a pair, and 4 VP for controlling more objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Warped_Ruins.png\"},\"Curse of the Gnaw\":{\"rule\":\"Twist: Instability starts at 1 and rises when a Place of Power is activated. The underdog can use Echoes of Blight City to damage units contesting an objective. Score 3 VP for each named objective, plus 4 VP for controlling more objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Curse_of_the_Gnaw.png\"},\"Seize the Embers\":{\"rule\":\"Twist: Armies search the ruins for emberstone nuggets and can return them to base camp. Score 3 VP for an objective, then round-specific points for controlling objectives or using Back to Base Camp, plus 4 VP for controlling more objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Seize_the_Embers1.png\"},\"Treacherous Ground\":{\"rule\":\"Twist: Objectives begin stable. Both armies use Tread Carefully, and from battle round 2 the underdog can use Violent Tremor to shift stability. Score 3 VP for a stable objective, 3 VP for two or more, and 4 VP for controlling more stable objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Treacherous_Ground.png\"},\"Escape From the Coast\":{\"rule\":\"Twist: The underdog can use To the Ships! to remove a Heldenhain or Sun Seekers objective. Score 3 VP for an objective, 3 VP for two or more, and 4 VP for controlling more objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Escape_From_the_Coast.png\"},\"Power of the Realms\":{\"rule\":\"Twist: Sun Seekers starts as the primary objective. The underdog can use Arcane Charge to move the primary objective. Score 3 VP for the primary objective, 3 VP for two or more secondary objectives, and 4 VP for controlling more objectives.\",\"map\":\"https://www.wahapedia.ru/aos4/img/battleplans/Power_of_the_Realms.png\"}};\nconst metrics=[['Command Points','CP','command'],['Army Points','AP','army'],['Rage Dice','RD','rage'],['Fury Level','FL','fury'],['Victory Points','VP','victory']];\r\nconst goalNames=['Affray','Strike','Domination'];const live=true;\r\nlet selectedTable='',screen='lobby';\r\nlet confirmed=null,view=null,pending=[],busy=false,failed=false,loading=false,refreshing=false,renderDeferred=false,mutationVersion=0;\r\nconst status=document.querySelector('#status'),retry=document.querySelector('#retry');\r\nfunction message(text,error=false){status.textContent=text;status.classList.toggle('error',error)}\r\nfunction total(p){p.tacticPoints=p.tactics.reduce((n,t)=>n+t.goals.reduce((a,b)=>a+b,0),0);p.victory=p.baseVictory+(view.autoTacticVP?p.tacticPoints:0)}\r\nfunction project(){view=JSON.parse(JSON.stringify(confirmed));for(const c of pending){if((view.changeIds||[]).includes(c.id))continue;if(c.scope==='newGame')continue;if(c.scope==='game'&amp;&amp;['advance','back'].includes(c.key)){view.game=stepGame(view.game,c);continue;}if(c.scope==='game'){if(c.key==='turn'){view.game.turn=c.turn;view.game.phase=c.phase}else view.game[c.key]=c.value}else{const p=view.players[c.player];if(c.key==='goal')p.tactics[c.slot].goals[c.goal]=c.value;else if(c.key==='tactic'){if(p.tactics[c.slot].name!==c.value)p.tactics[c.slot]={name:c.value,goals:[0,0,0]}}else if(c.key==='victory'){p.baseVictory=c.operation==='increment'?p.baseVictory+c.delta:c.value-(view.autoTacticVP?p.tacticPoints:0)}else if(c.operation==='increment')p[c.key]+=c.delta;else p[c.key]=c.value;total(p)}}view.players.forEach(total)}\r\nfunction enqueue(change){if(!confirmed)return;mutationVersion++;change.id=crypto.randomUUID();change.table=selectedTable;change.gameId=confirmed.game.id;pending.push(change);project();render();message('Saving score…');pump()}\r\nfunction renderWhenSafe(){if(['INPUT','SELECT'].includes(document.activeElement.tagName))renderDeferred=true;else render()}\r\nfunction stateForTable(){\r\n  if(!config||!records)return null;\r\n  const tables=Object.values(config.tables||{}).filter(Boolean).map(t=>({...t,hasGame:!!records[t.id]?.game?.id,gameId:records[t.id]?.game?.id||'',battleplan:records[t.id]?.game?.battleplan||''}));\r\n  if(!tables.length)throw new Error('No active tables. Add a table in Google Sheets.');\r\n  if(!tables.some(t=>t.id===selectedTable))selectedTable=tables[0].id;\r\n  const table=tables.find(t=>t.id===selectedTable),record=records[selectedTable];\r\n  if(!record)throw new Error('This table is being prepared. Please try again shortly.');\r\n  return {...normalize(record),table,tables,catalogs:{armies:config.catalogs?.armies||[],battleplans:config.catalogs?.battleplans||[],tactics:config.catalogs?.tactics||[]},autoTacticVP:true};\r\n}\r\nfunction receive(){\r\n  try{const data=stateForTable();if(!data)return;confirmed=data;project();renderWhenSafe();loading=false;if(!pending.length)sheetMessage();}\r\n  catch(error){message(error.message,true);retry.hidden=false;}\r\n}\r\nasync function pump(){\r\n  if(busy||failed||!pending.length)return;busy=true;const change=pending[0];\r\n  try{\r\n    const result=await runTransaction(ref(db,'games/'+change.table),record=>apply(record,change,stepGame,confirmed.catalogs),{applyLocally:false});\r\n    if(!result.committed)throw new Error('Score change was not saved.');\r\n    records[change.table]=result.snapshot.val();queueSheetSync(change.table);const done=pending.shift();confirmed=stateForTable();\r\n    if(done.scope==='newGame'){screen='play';document.activeElement?.blur();}\r\n    busy=false;project();renderWhenSafe();if(pending.length)pump();else sheetMessage();\r\n  }catch(error){busy=false;if(error.message.includes('Another game')){pending=[];failed=false;receive();message(error.message,true);}else{failed=true;retry.hidden=false;message('Save failed: '+error.message+' Your change is queued for retry.',true);}}\r\n}\r\nasync function fetchState(manual=false){\r\n  if(busy||pending.length||refreshing)return;refreshing=true;\r\n  try{if(!subscribed){refreshing=false;await boot();return;}if(manual)message('Refreshing lists and scores…');const [c,g]=await Promise.all([get(ref(db,'config')),get(ref(db,'games'))]);config=c.val();records=g.val();refreshing=false;receive();}\r\n  catch(error){refreshing=false;message('Could not load data: '+error.message,true);retry.hidden=false;}\r\n}\r\nconst sheetEndpoint='https://script.google.com/macros/s/AKfycbx-IQvLhEKweR_7fnkhjODMzUUs3UbmKT2_PHjlhbDSZJEsnU8UrDciGhAsPU33R3I/exec';\nconst sheetChannel=crypto.randomUUID();\nlet sheetWindow=null,sheetOrigin='',sheetBusy=null,sheetRetryTimer=null;\nconst sheetDirty=new Set(),sheetSynced={},sheetRetryCounts={};\nconst sheetFrame=document.createElement('iframe');sheetFrame.hidden=true;sheetFrame.title='Live Google Sheets export';sheetFrame.src=sheetEndpoint+'?bridge=1&amp;channel='+sheetChannel;document.body.append(sheetFrame);\nfunction sheetMessage(){if(pending.length)return;if(!connected)message('Reconnecting · scores shown may be out of date.');else if(sheetDirty.size||sheetBusy)message('Scores saved · updating live Google Sheet…');else if(sheetWindow)message('Live scores and Google Sheet connected.');else message('Scores saved · connecting live Google Sheet…');}\nfunction queueSheetSync(table){sheetDirty.add(table);sheetRetryCounts[table]=0;clearTimeout(sheetRetryTimer);sheetRetryTimer=setTimeout(pumpSheets,180);}\nfunction pumpSheets(){\n  if(!sheetWindow||sheetBusy||!sheetDirty.size)return;\n  const table=sheetDirty.values().next().value,id=crypto.randomUUID();sheetDirty.delete(table);sheetBusy={table,id,revision:records?.[table]?.revision||0};\n  sheetWindow.postMessage({type:'tt-export',channel:sheetChannel,id,table},sheetOrigin);sheetMessage();\n  sheetRetryTimer=setTimeout(()=>retrySheet('The live Sheet exporter did not respond.'),20000);\n}\nfunction retrySheet(error){\n  if(!sheetBusy)return;const table=sheetBusy.table;sheetBusy=null;clearTimeout(sheetRetryTimer);sheetDirty.add(table);sheetRetryCounts[table]=(sheetRetryCounts[table]||0)+1;\n  if(sheetRetryCounts[table]&lt;=4)sheetRetryTimer=setTimeout(pumpSheets,1000*Math.min(4,sheetRetryCounts[table]));\n  else message('Scores saved. Live Sheet export is delayed: '+error+' The background export will retry.',true);\n}\nwindow.addEventListener('message',event=>{\n  if(!/^https:\\/\\/[a-z0-9-]+\\.googleusercontent\\.com$/.test(event.origin)||event.data?.channel!==sheetChannel||event.data?.type!=='tt-sheets')return;\n  if(event.data.ready){sheetWindow=event.source;sheetOrigin=event.origin;for(const [id,record] of Object.entries(records||{}))if(record)sheetDirty.add(id);pumpSheets();return;}\n  if(!sheetBusy||event.source!==sheetWindow||event.data.id!==sheetBusy.id)return;\n  if(event.data.error||event.data.result?.busy){retrySheet(event.data.error||'Exporter is busy.');return;}\n  clearTimeout(sheetRetryTimer);const {table,revision}=sheetBusy;sheetSynced[table]=event.data.result.revision;sheetBusy=null;\n  if((records?.[table]?.revision||0)>event.data.result.revision)sheetDirty.add(table);\n  sheetRetryCounts[table]=0;sheetMessage();pumpSheets();\n});\nsetTimeout(()=>{if(!sheetWindow)message('Live scores connected. Fast Sheet export could not connect; background export is still active.',true);},25000);\nfunction sheetRecordsChanged(next){\n  for(const [id,record] of Object.entries(next||{}))if(record&amp;&amp;records?.[id]&amp;&amp;(record.revision||0)!==(records[id].revision||0))queueSheetSync(id);\n}\n\nasync function boot(){\r\n  if(starting)return;starting=true;\r\n  try{await auth.authStateReady();if(!auth.currentUser)await signInAnonymously(auth);\r\n    if(!subscribed){subscribed=true;const fail=error=>{message('Could not load live data: '+error.message,true);retry.hidden=false;};\r\n      onValue(ref(db,'config'),s=>{config=s.val();receive();},fail);\r\n      onValue(ref(db,'games'),s=>{sheetRecordsChanged(s.val());records=s.val();receive();},fail);\r\n      onValue(ref(db,'.info/connected'),s=>{connected=s.val()===true;if(confirmed&amp;&amp;!pending.length)receive();});\r\n    }\r\n  }catch(error){message('Could not connect: '+error.message,true);retry.hidden=false;}finally{starting=false;}\r\n}\r\nretry.onclick=()=>{retry.hidden=true;if(pending.length){failed=false;pump()}else fetchState(true)};document.querySelector('#refresh').onclick=()=>fetchState(true);\r\ndocument.addEventListener('focusout',()=>setTimeout(()=>{if(renderDeferred&amp;&amp;!['INPUT','SELECT'].includes(document.activeElement.tagName)){renderDeferred=false;render()}},0));\r\nfunction options(select,names,selected,placeholder,exclude=''){select.replaceChildren();const first=new Option(placeholder,'');select.append(first);for(const name of names){const option=new Option(name,name);option.disabled=!!exclude&amp;&amp;name===exclude;select.append(option)}if(selected&amp;&amp;!names.includes(selected)){select.append(new Option(selected+' · not in the active list',selected))}select.value=selected;select.disabled=false}\r\nfunction button(text,label,fn,pressed){const el=document.createElement('button');el.textContent=text;el.setAttribute('aria-label',label);if(pressed!==undefined)el.setAttribute('aria-pressed',pressed?'true':'false');el.onclick=fn;return el}\r\nfunction render(){if(!view)return;renderScreen();if(screen!=='play')return;const game=view.game;document.querySelector('#tableTitle').textContent=view.table.name;document.querySelector('#battleplanName').textContent=game.battleplan||'Choose a battleplan';document.querySelector('#battleplanInfo').onclick=()=>showBattleplan(game.battleplan);document.querySelector('#turnlabel').textContent=turnText(game);document.querySelector('#activeLabel').textContent=game.active?'Active army: '+(view.players[game.active-1].faction||view.players[game.active-1].name):'No active player';const next=document.querySelector('#nextTurn');next.disabled=pending.length>=10||(game.turn===5&amp;&amp;game.phase==='END');next.textContent=game.turn===5&amp;&amp;game.phase==='END'?'Game finished':'Next turn →';document.querySelector('#nextLabel').textContent='NEXT: '+nextText(game);const back=document.querySelector('#backTurn');back.disabled=!game.turn||pending.length>=10;back.onclick=()=>enqueue({scope:'game',key:'back'});next.onclick=()=>advance();const root=document.querySelector('.players');root.replaceChildren();view.players.forEach((p,i)=>{const card=document.createElement('article');card.className='player'+(game.active===i+1?' active':'');const head=document.createElement('div');head.className='playerhead';const name=document.createElement('input');name.className='name';name.value=p.name;name.maxLength=60;name.setAttribute('aria-label','Player name '+(i+1));name.onchange=()=>{const value=name.value.trim();if(!value||/^[=+\\-@]/.test(value)){name.value=p.name;message('Please enter a valid player name.',true);return}enqueue({scope:'player',player:i,key:'name',value})};head.append(name,button(game.active===i+1?'Active player':'Make active','Player '+(i+1)+' make active',()=>enqueue({scope:'game',key:'active',value:game.active===i+1?0:i+1}),game.active===i+1));head.lastChild.className='activebtn';card.append(head);const faction=document.createElement('select');faction.className='faction';faction.setAttribute('aria-label','Army player '+(i+1));options(faction,view.catalogs.armies,p.faction,'Choose an army');faction.onchange=()=>enqueue({scope:'player',player:i,key:'faction',value:faction.value});card.append(faction);const grid=document.createElement('div');grid.className='metrics';metrics.forEach(([label,short,key])=>{const row=document.createElement('div');row.className='metric'+(key==='victory'?' victory':'');const title=document.createElement('div');title.className='metric-label';title.innerHTML='&lt;spa   sheet.getRange(2,1,rows.length,headers.length).setValues(rows);
