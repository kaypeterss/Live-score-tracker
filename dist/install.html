t;&lt;/div&gt;&lt;/div&gt;&lt;section id=\"lobby\" class=\"lobby\" hidden&gt;&lt;h2&gt;Waar spelen jullie?&lt;/h2&gt;&lt;label for=\"tableChoice\"&gt;Tafel&lt;/label&gt;&lt;select id=\"tableChoice\"&gt;&lt;/select&gt;&lt;p id=\"tableSummary\"&gt;&lt;/p&gt;&lt;div class=\"lobby-actions\"&gt;&lt;button id=\"continueGame\" class=\"primary\"&gt;Bestaand spel verder spelen&lt;/button&gt;&lt;button id=\"newGame\"&gt;Nieuw spel&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;&lt;form id=\"setup\" class=\"lobby\" hidden&gt;&lt;h2&gt;Nieuw spel · &lt;span id=\"setupTable\"&gt;&lt;/span&gt;&lt;/h2&gt;&lt;label for=\"setupPlan\"&gt;Battleplan *&lt;/label&gt;&lt;select id=\"setupPlan\" required&gt;&lt;/select&gt;&lt;div class=\"setup-players\" id=\"setupPlayers\"&gt;&lt;/div&gt;&lt;p&gt;Alle scores starten op 0, Command Points op 4. De turn begint op ‘-’.&lt;/p&gt;&lt;div class=\"lobby-actions\"&gt;&lt;button class=\"primary\" type=\"submit\"&gt;Spel starten&lt;/button&gt;&lt;button type=\"button\" id=\"cancelSetup\"&gt;Terug&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;&lt;dialog id=\"starterDialog\"&gt;&lt;h2&gt;Wie begint deze turn?&lt;/h2&gt;&lt;p&gt;Deze speler wordt de actieve speler bij Top.&lt;/p&gt;&lt;div id=\"starterButtons\" class=\"starter-buttons\"&gt;&lt;/div&gt;&lt;button id=\"cancelStarter\"&gt;Annuleren&lt;/button&gt;&lt;/dialog&gt;&lt;div id=\"workspace\" hidden&gt;&lt;div class=\"tablebar\"&gt;&lt;h2 id=\"tableTitle\"&gt;&lt;/h2&gt;&lt;button id=\"changeTable\"&gt;Andere tafel / spel&lt;/button&gt;&lt;/div&gt;&lt;section class=\"game\" aria-label=\"Instellingen voor beide spelers\"&gt;&lt;div&gt;&lt;label for=\"battleplan\"&gt;Battleplan · voor beide spelers&lt;/label&gt;&lt;select id=\"battleplan\" disabled&gt;&lt;option&gt;Kies een battleplan&lt;/option&gt;&lt;/select&gt;&lt;p class=\"game-note\" id=\"activeLabel\"&gt;&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=\"turn-display\" id=\"turnlabel\"&gt;-&lt;/div&gt;&lt;div class=\"turn-actions\"&gt;&lt;button class=\"primary\" id=\"nextTurn\"&gt;Volgende fase →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=\"players\" aria-label=\"Scores voor twee spelers\"&gt;&lt;/section&gt;&lt;/div&gt;&lt;iframe id=\"remote\" title=\"Scorebord gekoppeld aan Google Sheets\"&gt;&lt;/iframe&gt;&lt;details&gt;&lt;summary&gt;Keuzelijsten en gegevens beheren in Google Sheets&lt;/summary&gt;&lt;p&gt;Voeg een naam toe op een nieuwe rij in de Sheet. Nieuwe opties verschijnen automatisch in de app, of direct via ‘Lijsten vernieuwen’.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;AoS Legers:&lt;/strong&gt; naam in kolom A, alliantie in B. Actief in C; een lege cel telt als actief.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;AoS Battleplans:&lt;/strong&gt; naam in A, tabel in B. Actief in C.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;AoS Battletactics:&lt;/strong&gt; naam in A. Actief in B.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;AoS Tafels:&lt;/strong&gt; voeg een rij toe met een uniek ID in A, een tafelnaam in B en Actief in C. Elke tafel krijgt automatisch een eigen spelblad.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Spel · ID:&lt;/strong&gt; de spelers staan naast elkaar. Pas scores, legers, battletactics en doelen (0 of 5) direct op dit blad aan. Overige VP en totaal staan apart.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;AoS Scorebord (archief):&lt;/strong&gt; scores, leger en twee battletactics per speler. Doelen zijn 0 of 5. Bewerk overige Victory Points in kolom D; battletactic-punten en het volledige totaal staan in Q en R.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;AoS Spel (archief):&lt;/strong&gt; gezamenlijk battleplan, actieve speler (0, 1 of 2), turn (0–5) en fase (-, Top, Bot, END).&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;Vink ‘Actief’ uit om een optie te verbergen. Bestaande selecties blijven herkenbaar totdat je zelf een andere keuze maakt.&lt;/p&gt;&lt;p class=\"tactic-note\"&gt;Battleplans: &lt;a href=\"https://aosmissions.app/battleplans\" target=\"_blank\" rel=\"noopener\"&gt;AoS Missions · General’s Handbook 2026–27&lt;/a&gt;. Legers: &lt;a href=\"https://www.warhammer-community.com/en-gb/articles/yqfizsmh/prepare-for-the-new-generals-handbook-with-scourge-of-aqshy/\" target=\"_blank\" rel=\"noopener\"&gt;Warhammer Community · Scourge of Aqshy&lt;/a&gt;. De bron van elke optie staat ook in de Sheet.&lt;/p&gt;&lt;/details&gt;&lt;/main&gt;&lt;script&gt;\nconst metrics=[['Command Points','CP','command'],['Army Points','AP','army'],['Rage Dice','RD','rage'],['Fury Level','FL','fury'],['Victory Points','VP','victory']];\nconst goalNames=['Affray','Strike','Domination'];const live=typeof google!=='undefined'&amp;&amp;google.script&amp;&amp;google.script.run;\nlet selectedTable='',screen='lobby';\nlet confirmed=null,view=null,pending=[],busy=false,failed=false,loading=false,refreshing=false,renderDeferred=false,mutationVersion=0;\nconst status=document.querySelector('#status'),retry=document.querySelector('#retry');\nfunction message(text,error=false){status.textContent=text;status.classList.toggle('error',error)}\nfunction total(p){p.tacticPoints=p.tactics.reduce((n,t)=&gt;n+t.goals.reduce((a,b)=&gt;a+b,0),0);p.victory=p.baseVictory+(view.autoTacticVP?p.tacticPoints:0)}\nfunction project(){view=JSON.parse(JSON.stringify(confirmed));for(const c of pending){if(c.scope==='newGame'||c.key==='advance')continue;if(c.scope==='game'){if(c.key==='turn'){view.game.turn=c.turn;view.game.phase=c.phase}else view.game[c.key]=c.value}else{const p=view.players[c.player];if(c.key==='goal')p.tactics[c.slot].goals[c.goal]=c.value;else if(c.key==='tactic'){if(p.tactics[c.slot].name!==c.value)p.tactics[c.slot]={name:c.value,goals:[0,0,0]}}else if(c.key==='victory'){p.baseVictory=c.operation==='increment'?p.baseVictory+c.delta:c.value-(view.autoTacticVP?p.tacticPoints:0)}else if(c.operation==='increment')p[c.key]+=c.delta;else p[c.key]=c.value;total(p)}}view.players.forEach(total)}\nfunction enqueue(change){if(!confirmed)return;mutationVersion++;change.id=crypto.randomUUID();change.table=selectedTable;change er,'');select.append(first);for(const name of names){const option=new Option(name,name);option.disabled=!!exclude&amp;&amp;name===exclude;select.append(option)}if(selected&amp;&amp;!names.includes(selected)){select.append(new Option(selected+' · niet in actieve lijst',selected))}select.value=selected;select.disabled=false}\nfunction button(text,label,fn,pressed){const el=document.createElement('button');el.textContent=text;el.setAttribute('aria-label',label);if(pressed!==undefined)el.setAttribute('aria-pressed',pressed?'true':'false');el.onclick=fn;return el}\nfunction render(){if(!view)return;renderScreen();if(screen!=='play')return;const game=view.game;document.querySelector('#tableTitle').textContent=view.table.name;options(document.querySelector('#battleplan'),view.catalogs.battleplans,game.battleplan,'Kies een battleplan');document.querySelector('#battleplan').onchange=e=&gt;enqueue({scope:'game',key:'battleplan',value:e.target.value});document.querySelector('#turnlabel').textContent=game.turn?'Turn '+game.turn+' / 5 · '+game.phase:'- · Nog niet begonnen';document.querySelector('#activeLabel').textContent=game.active?'Actieve speler: '+view.players[game.active-1].name:'Geen actieve speler';const next=document.querySelector('#nextTurn');next.disabled=busy||pending.length&gt;0||(game.turn===5&amp;&amp;game.phase==='END');next.textContent=!game.turn?'Start turn 1 →':game.phase==='Top'?'Volgende fase · Bot →':game.phase==='Bot'?'Sluit turn af · END →':game.turn===5?'Spel afgelopen':'Start turn '+(game.turn+1)+' →';next.onclick=()=&gt;advance();const root=document.querySelector('.players');root.replaceChildren();view.players.forEach((p,i)=&gt;{const card=document.createElement('article');card.className='player'+(game.active===i+1?' active':'');const head=document.createElement('div');head.className='playerhead';const name=document.createElement('input');name.className='name';name.value=p.name;name.maxLength=60;name.setAttribute('aria-label','Naam speler '+(i+1));nam
